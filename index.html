<style>
:root{

  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  --ink:#1B1838; --muted:#6A668C;
  --free:#0B8FA6; --free-bg:#DDF4F8;
  --use:#B26A00; --use-bg:#FFEBCC;
  --book:#5B4BD6; --book-bg:#E6E2FF;
  --over:#C9264A; --over-bg:#FFDDE4;
  --done:#6A668C; --done-bg:#E7E6F0;
  --accent:#5B4BD6; --accent-ink:#FFFFFF;

}

  :root:not([data-theme="light"]){
    --bg:#0F0D24; --panel:#1A1738; --panel2:#241F4A; --line:#332E63;
    --ink:#EEEBFF; --muted:#A29DCF;

  }
}
:root[data-theme="dark"]{
  --bg:#0F0D24; --panel:#1A1738; --panel2:#241F4A; --line:#332E63;
  --ink:#EEEBFF; --muted:#A29DCF;
  --free:#4FD8EE; --free-bg:#12343F;
  --use:#FFB84D; --use-bg:#3B2B0E;
  --book:#A99BFF; --book-bg:#2C2563;
  --over:#FF6B8A; --over-bg:#46182A;
  --done:#A29DCF; --done-bg:#272350;
  --accent:#A99BFF; --accent-ink:#13103A;
  --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
.disp{font-family:"Chakra Petch",system-ui,sans-serif;letter-spacing:.01em}
h1,h2,h3{margin:0;font-family:"Chakra Petch",system-ui,sans-serif;font-weight:600}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:30}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:700 26px "Chakra Petch",system-ui,sans-serif;color:var(--accent);letter-spacing:.04em}
.brand span{color:var(--muted);font-size:13px}
.brand{align-items:center}
.brand .bn{display:flex;flex-direction:column;line-height:1.1}
.brand .logo{width:46px;height:46px;object-fit:contain;flex:none}
.clock{margin-left:auto;text-align:right;line-height:1.1}
.clock b{display:block;font:600 22px "Chakra Petch",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.clock span{font-size:12px;color:var(--muted)}
.syncbtn{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px;white-space:nowrap}
.syncbtn[hidden]{display:none}
.tab[hidden]{display:none}
.syncbtn i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.syncbtn.ok i{background:var(--free)}
.syncbtn.err i{background:var(--over)}
.syncbtn.pend i{background:var(--use)}
.tabs{max-width:1200px;margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.cell:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{max-width:1200px;margin:0 auto;padding:16px}
.banner{background:var(--use-bg);color:var(--use);border:1px solid var(--use);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:13px}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font:600 24px "Chakra Petch",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-left-width:6px;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.card.free{border-left-color:var(--free)}
.card.active{border-left-color:var(--use)}
.card.over{border-left-color:var(--over);background:var(--over-bg)}
.card.due{border-left-color:var(--book)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-h h3{font-size:18px}
.rate{font-size:12px;color:var(--muted)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.chip.free{background:var(--free-bg);color:var(--free)}
.chip.active{background:var(--use-bg);color:var(--use)}
.chip.over{background:var(--over-bg);color:var(--over)}
.chip.due,.chip.booked{background:var(--book-bg);color:var(--book)}
.chip.done{background:var(--done-bg);color:var(--done)}
.chip.cancelled,.chip.noshow{background:var(--done-bg);color:var(--done)}
.timer{font:700 40px/1 "Chakra Petch",system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--use)}
.card.over .timer{color:var(--over)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--use);width:0}
.card.over .bar i{background:var(--over)}
.who{font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.entry{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.two>*{min-width:0}
input[type=date]{min-width:0;max-width:100%}
.card.paused{border-left-color:var(--book)}
.card.paused .timer{color:var(--book)}
.card.paused .bar i{background:var(--book)}
.sub{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--over);border-color:var(--over);background:transparent}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.bar-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar-tools h2{font-size:20px;margin-right:auto}
.date{display:flex;gap:6px;align-items:center}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=password],select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%}
.date input{width:auto}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{padding:0;border-bottom:1px solid var(--line);text-align:left}
.slots th{position:sticky;top:0;background:var(--panel2);padding:8px 6px;font-size:13px;min-width:96px;text-align:center}
.slots th.t,.slots td.t{position:sticky;left:0;min-width:84px;background:var(--panel2);padding:6px 10px;font-size:13px;font-weight:600;z-index:1;text-align:left}
.cell{display:block;width:100%;min-height:46px;border:0;background:transparent;cursor:pointer;padding:4px 6px;text-align:left;font-size:12px;border-left:1px solid var(--line)}
.cell.free:hover{background:var(--free-bg)}
.cell.free{color:var(--muted)}
.cell.past{color:var(--muted);opacity:.45;cursor:not-allowed}
.cell.booked{background:var(--book-bg);color:var(--book)}
.cell.active{background:var(--use-bg);color:var(--use)}
.cell.done{background:var(--done-bg);color:var(--done)}
.cell b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.log th{background:var(--panel2);font-size:12px;padding:8px 10px;white-space:nowrap}
.log td{padding:9px 10px;font-size:14px;white-space:nowrap}
.log td.num{font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.setup{display:grid;gap:16px;max-width:760px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel h2{font-size:18px;margin-bottom:10px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600}
label.f>*{margin-top:4px;font-weight:400;color:var(--ink)}
.st-row{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-bottom:8px;align-items:center}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

.modal-bg{position:fixed;inset:0;background:rgba(10,8,30,.55);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:0}
.modal-bg.on{display:flex}
.modal{background:var(--panel);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}

.modal h2{font-size:20px;margin-bottom:12px}
.form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--over);font-size:13px;min-height:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-bottom:10px}
.kv span{color:var(--muted)}

.total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 12px}

.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}

/* ---------- phone layout ---------- */
button,.cell{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:700px){
  input[type=text],input[type=tel],input[type=number],input[type=date],input[type=password],select{font-size:16px;min-height:44px}

  .brand span{display:block;font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .clock b{font-size:19px}

  .tab{border-bottom:0;border-top:3px solid transparent;padding:14px 2px 12px;text-align:center;font-size:13px;min-height:56px}
  .tab[aria-selected="true"]{border-top-color:var(--accent);background:var(--panel2)}
  .tab .lg{display:none}
  main{padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px))}
  .summary{grid-template-columns:1fr 1fr;gap:8px}
  .stat b{font-size:22px}
  .grid{grid-template-columns:1fr;gap:10px}
  .card{padding:14px}
  .timer{font-size:46px}
  .row .btn{flex:1 1 0;min-height:46px;font-size:15px}
  .row .btn.sm{flex:0 0 auto;padding:8px 16px}
  .btn{min-height:44px}
  .btn.sm{min-height:40px}
  .bar-tools{gap:8px}
  .bar-tools h2{flex:1 0 100%}
  .date{flex:1 1 100%}
  .date input{flex:1;min-width:0}
  .scroll:has(.slots){max-height:calc(100dvh - 240px);overflow:auto}
  .slots th{min-width:82px;font-size:12px;padding:8px 4px}
  .slots th.t,.slots td.t{min-width:70px;padding:6px 8px;font-size:12px}
  .cell{min-height:54px}
  .cell b{max-width:74px}
  .log thead{display:none}
  .log,.log tbody,.log tr,.log td{display:block;width:100%}
  .log tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px;border-bottom:1px solid var(--line)}
  .log td{padding:0;border:0;white-space:normal}
  .log td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted)}
  .log td:first-child{grid-column:1/-1}
  .log td:first-child::before{display:none}
  .setup{gap:12px}
  .st-row{grid-template-columns:1fr 84px auto}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .modal{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
}

<script>
(function(){
"use strict";

/* ---------- defaults & state ---------- */
var DEFAULT_CONFIG = {
  stations:[
    {id:"ps4a",name:"PS4 1",rate:100},{id:"ps4b",name:"PS4 2",rate:100},
    {id:"ps4c",name:"PS4 3",rate:100},{id:"ps4p",name:"PS4 Pro",rate:120},
    {id:"ps5",name:"PS5",rate:150},{id:"xbs",name:"Xbox Series S",rate:120},
    {id:"proj",name:"Projector",rate:300}
  ],
  open:10, close:23, slotMin:60, minBillMin:30, roundMin:15, perPlayer:true, ob:{on:true,days:7,notice:15,max:180}, lounge:"Yourox Gaming Lounge", currency:"\u20B9"
};
var config = clone(DEFAULT_CONFIG);
var sessions = {};            // id -> session
var tab = "floor";
var slotDate = dayStart(Date.now());
var logDate = dayStart(Date.now());
var ledger = {};
var customers = {};
var revPreset = "month";
var revFrom = monthStart(Date.now());
var revTo = dayStart(Date.now());
var shared = false, db = null, downloads = null;
var writeChain = {};          // id -> promise
var memStore = {};
var setupMsg = {t:"",c:""};

function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function dayStart(ms){var d=new Date(ms);d.setHours(0,0,0,0);return d.getTime();}
function pad(n){return n<10?"0"+n:""+n;}
function monthStart(ms){var d=new Date(ms);d.setDate(1);d.setHours(0,0,0,0);return d.getTime();}
function fmtTime(ms){var d=new Date(ms);var h=d.getHours(),m=d.getMinutes();var ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+pad(m)+" "+ap;}
function fmtHour(h){var ap=h>=12&&h<24?"PM":"AM";var x=h%12||12;return x+":00 "+ap;}
function fmtDate(ms){return new Date(ms).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});}
function fmtDur(min){min=Math.max(0,Math.round(min));var h=Math.floor(min/60),m=min%60;return h?(h+"h"+(m?" "+m+"m":"")):(m+"m");}
function money(n){return config.currency+Math.round(n).toLocaleString();}
function inputDate(ms){var d=new Date(ms);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseInputDate(v){var p=v.split("-");return new Date(+p[0],+p[1]-1,+p[2]).getTime();}
function uid(){return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function stationById(id){return config.stations.filter(function(s){return s.id===id;})[0];}
function stationName(id){var s=stationById(id);return s?s.name:"(removed)";}
function list(){return Object.keys(sessions).map(function(k){return sessions[k];});}

/* ---------- storage layer ---------- */
function lsGet(k){try{var v=localStorage.getItem(k);return v==null?memStore[k]:v;}catch(e){return memStore[k];}}
function lsSet(k,v){memStore[k]=v;try{localStorage.setItem(k,v);}catch(e){}}

function saveSession(s){
  s._u=Date.now();sessions[s.id]=s; // optimistic
  if(!shared){lsSet("ygl_sessions",JSON.stringify(sessions));markDirty("s:"+s.id);syncSoon();return Promise.resolve();}
  var prev=writeChain[s.id]||Promise.resolve();
  var p=prev.catch(function(){}).then(function(){return db.doc("sessions/"+s.id).set(s);});
  writeChain[s.id]=p;
  return p.catch(function(e){toast(writeErr(e));throw e;});
}
function saveLedgerOld(e){
  ledger[e.id]=e;
  if(!shared){lsSet("ygl_ledger",JSON.stringify(ledger));return Promise.resolve();}
  return db.doc("ledger/"+e.id).set(e).catch(function(err){toast(writeErr(err));throw err;});
}
function deleteLedgerOld(id){
  delete ledger[id];
  if(!shared){lsSet("ygl_ledger",JSON.stringify(ledger));return Promise.resolve();}
  return db.doc("ledger/"+id).delete().catch(function(err){toast(writeErr(err));throw err;});
}
function saveConfig(){
  config._u=Date.now();if(!shared){lsSet("ygl_config",JSON.stringify(config));markDirty("c:main");syncSoon();return Promise.resolve();}
  return db.doc("config/main").set(JSON.parse(JSON.stringify(config))).catch(function(e){toast(writeErr(e));throw e;});
}
function writeErr(e){
  if(e&&e.code==="invalid_argument")return "Couldn\u2019t save. You may have view-only access to this app.";
  if(e&&e.code==="quota_exceeded")return "Storage is full. Ask the owner to clear old records.";
  return "Couldn\u2019t save. Check your connection and try again.";
}

async function initStore(){
  try{ if(window.claude&&window.claude.use){ db=await window.claude.use("db"); downloads=await window.claude.use("downloads"); } }catch(e){db=null;}
  if(db){
    shared=true;

      if(snap.exists){config=Object.assign(clone(DEFAULT_CONFIG),JSON.parse(JSON.stringify(snap.data())));}
      else config=clone(DEFAULT_CONFIG);

    },function(){});
    db.collection("ledger").onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=JSON.parse(JSON.stringify(d.data()));});ledger=m;refresh();},function(){});
    var since=Date.now()-800*86400000;

      var m={};snap.docs.forEach(function(d){m[d.id]=JSON.parse(JSON.stringify(d.data()));});

function loadLocal(){

/* ---------- domain logic ---------- */
function effStatus(s,now){
  if(s.status==="booked"&&now>s.endsAt)return "noshow";
  return s.status;
}
function interval(s,now){
  if(s.status==="active")return [s.checkIn,Math.max(s.endsAt+(s.pausedAt?now-s.pausedAt:0),now)];
  if(s.status==="done")return [s.checkIn,s.checkOut];
  return [s.startAt,s.endsAt];
}
function conflicts(stationId,start,end,excludeId){
  var now=Date.now();
  return list().filter(function(s){
    if(s.stationId!==stationId||s.id===excludeId)return false;
    if(s.status!=="booked"&&s.status!=="active")return false;
    if(s.status==="booked"&&now>s.endsAt)return false;
    var iv=interval(s,now);return iv[0]<end&&iv[1]>start;
  });
}
function stationState(st,now){
  var all=list().filter(function(s){return s.stationId===st.id;});
  var act=all.filter(function(s){return s.status==="active";})[0];
  if(act)return {kind:"active",s:act};
  var up=all.filter(function(s){return s.status==="booked"&&s.endsAt>now;}).sort(function(a,b){return a.startAt-b.startAt;});
  if(up.length){
    var n=up[0];
    if(now>=n.startAt-10*60000)return {kind:"due",s:n,late:now>n.startAt+15*60000};
    return {kind:"free",next:n};
  }
  return {kind:"free"};
}
function playedMin(s,end){return Math.max(0,(end-s.checkIn-(s.pausedMs||0)-(s.pausedAt?end-s.pausedAt:0))/60000);}
function billing(s,outMs){
  var st=stationById(s.stationId);
  var rate=s.rate!=null?s.rate:(st?st.rate:0);
  var played=playedMin(s,outMs);
  var step=Math.max(1,config.roundMin||15);
  var billed=Math.max(config.minBillMin||0,Math.ceil(played/step)*step);
  var np=config.perPlayer===false?1:Math.max(1,s.players||1);return {played:played,billed:billed,rate:rate,players:np,amount:billed/60*rate*np};
}

/* ---------- actions ---------- */
function checkIn(s){
  var now=Date.now();
  var other=list().filter(function(x){return x.stationId===s.stationId&&x.status==="active"&&x.id!==s.id;})[0];
  if(other){toast("Check out "+other.name+" from "+stationName(s.stationId)+" first.");return;}
  var n=Object.assign({},s,{status:"active",checkIn:now});
  saveSession(n).then(function(){toast(esc(s.name)+" checked in.");}).catch(function(){});
  render();
}
function walkIn(f){
  var now=Date.now();
  var st=stationById(f.stationId);
  var s={id:uid(),stationId:f.stationId,name:f.name,phone:f.phone,players:f.players,status:"active",
    startAt:now,endsAt:now+f.dur*60000,checkIn:now,checkOut:null,rate:st.rate,amount:null,pay:null,walkIn:true,createdAt:now};
  saveSession(s).then(function(){toast(esc(f.name)+" checked in to "+st.name+".");}).catch(function(){});
}
function bookSlot(f){
  var st=stationById(f.stationId);
  var s={id:uid(),stationId:f.stationId,name:f.name,phone:f.phone,players:f.players,status:"booked",
    startAt:f.start,endsAt:f.end,checkIn:null,checkOut:null,rate:st.rate,amount:null,pay:null,walkIn:false,createdAt:Date.now()};
  saveSession(s).then(function(){toast("Slot booked for "+f.name+".");}).catch(function(){});
}
function cancelBooking(s){
  saveSession(Object.assign({},s,{status:"cancelled"})).then(function(){toast("Booking cancelled.");}).catch(function(){});
}
function checkOut(s,pay,amt,rec){
  var now=Date.now();var b=billing(s,now);
  var n=Object.assign({},s,{status:"done",checkOut:now,pausedAt:null,pausedMs:(s.pausedMs||0)+(s.pausedAt?now-s.pausedAt:0),amount:(amt==null?Math.round(b.amount):amt),received:(rec==null?null:rec),calcAmount:Math.round(b.amount),pay:pay,billedMin:b.billed});
  saveSession(n).then(function(){toast(esc(s.name)+" checked out. Collect "+money(amt==null?b.amount:amt)+".");}).catch(function(){});
}
function extendModal(id){
  var s=sessions[id];if(!s)return;
  var b="";
  [10,15,20,30,40,60,90].forEach(function(m){
    var clash=conflicts(s.stationId,s.endsAt,s.endsAt+m*60000,s.id).length>0;
    b+='<button class="btn" data-act="extgo" data-id="'+id+'" data-m="'+m+'"'+(clash?' disabled':'')+'>+'+fmtDur(m)+'</button>';
  });
  openModal('<h2>Extend '+esc(s.name)+'</h2><div class="sub" style="margin-bottom:10px">Now ends at '+fmtTime(s.endsAt)+'. Greyed options clash with the next booking.</div><div class="row" style="margin-top:0">'+b+'</div>'+
    '<div class="two" style="margin-top:12px;align-items:end"><label class="f">Custom minutes<input type="number" id="x-m" min="1" max="600" step="1" inputmode="numeric" placeholder="e.g. 25"></label><button class="btn primary" id="x-go">Extend</button></div>'+
    '<div class="actions"><button class="btn" data-act="mclose">Close</button></div>');
  document.getElementById("x-go").addEventListener("click",function(){
    var m=parseInt(document.getElementById("x-m").value,10);

  });
}
function pauseSession(s){saveSession(Object.assign({},s,{pausedAt:Date.now()})).then(function(){toast("Timer paused for "+s.name+".");}).catch(function(){});render();}
function resumeSession(s){var now=Date.now(),d=s.pausedAt?now-s.pausedAt:0,end=s.endsAt+d,c=conflicts(s.stationId,s.endsAt,end,s.id);saveSession(Object.assign({},s,{pausedAt:null,pausedMs:(s.pausedMs||0)+d,endsAt:end})).then(function(){toast(c.length?"Resumed. Now ends "+fmtTime(end)+", which overlaps another booking.":"Resumed. Slot now ends at "+fmtTime(end)+".");}).catch(function(){});render();}
function changePlayers(s,d){var n=Math.max(1,Math.min(8,(s.players||1)+d));if(n===s.players)return;saveSession(Object.assign({},s,{players:n})).then(function(){toast(n+(n===1?" player":" players")+" on "+stationName(s.stationId)+".");}).catch(function(){});render();}
function extend(s,min){
  var end=s.endsAt+min*60000;
  var c=conflicts(s.stationId,s.endsAt,end,s.id);
  if(c.length){toast("Can\u2019t extend. "+c[0].name+" is booked at "+fmtTime(c[0].startAt)+".");return;}
  saveSession(Object.assign({},s,{endsAt:end})).then(function(){toast("Extended by "+min+" minutes.");}).catch(function(){});
}

function payKey(p){p=String(p||"Cash").toLowerCase();return p==="upi"?"upi":(p==="card"?"card":"cash");}
function revenueByDay(from,to){
  var days={};
  function get(k){return days[k]||(days[k]={day:k,app:{cash:0,upi:0,card:0},man:{cash:0,upi:0,card:0}});}
  list().forEach(function(s){
    if(s.status!=="done")return;
    var k=dayStart(s.checkOut||s.checkIn||s.startAt);
    if(k<from||k>to)return;
    get(k).app[payKey(s.pay)]+=(s.amount||0);
  });
  Object.keys(ledger).forEach(function(id){
    var e=ledger[id];if(e.deleted)return;var k=dayStart(e.date);
    if(k<from||k>to)return;
    var m=get(k).man;m.cash+=e.cash||0;m.upi+=e.upi||0;m.card+=e.card||0;
  });
  return Object.keys(days).map(function(k){return days[k];}).sort(function(a,b){return b.day-a.day;});
}
function setRevPreset(p){
  var now=Date.now(),today=dayStart(now);revPreset=p;
  if(p==="today"){revFrom=today;revTo=today;}
  else if(p==="7"){revFrom=today-6*864e5;revTo=today;}
  else if(p==="month"){revFrom=monthStart(now);revTo=today;}
  else{revFrom=0;revTo=4e12;}
}
function renderRev(){
  var days=revenueByDay(revFrom,revTo);

  days.forEach(function(r){["cash","upi","card"].forEach(function(k){tot[k]+=r.app[k]+r.man[k];fromApp+=r.app[k];added+=r.man[k];});});
  var grand=tot.cash+tot.upi+tot.card;
  function chip(p,l){return '<button class="btn sm" data-act="rp" data-p="'+p+'" aria-pressed="'+(revPreset===p?"true":"false")+'">'+l+'</button>';}
  var h=banner()+'<div class="bar-tools"><h2>Revenue</h2><button class="btn primary sm" data-act="addrev">+ Add previous day</button></div>'+
    '<div class="chips">'+chip("today","Today")+chip("7","Last 7 days")+chip("month","This month")+chip("all","All time")+'</div>'+
    '<div class="two" style="margin-bottom:14px"><label class="f">From<input type="date" id="rf" value="'+(revFrom?inputDate(revFrom):"")+'"></label><label class="f">To<input type="date" id="rt" value="'+(revTo<4e12?inputDate(revTo):"")+'"></label></div>'+
    '<div class="summary">'+stat(money(grand),"total revenue")+stat(money(tot.cash),"cash")+stat(money(tot.upi),"UPI")+stat(money(tot.card),"card")+'</div>'+
    '<div class="sub" style="margin:-6px 0 14px">'+money(fromApp)+' recorded in the app + '+money(added)+' added by hand, over '+days.length+(days.length===1?" day":" days")+'.</div>';
  if(!days.length){h+='<div class="empty">No collections in this period yet.</div>';}
  else{
    h+='<div class="scroll"><table class="log"><thead><tr><th>Day</th><th>Cash</th><th>UPI</th><th>Card</th><th>Total</th><th>Source</th></tr></thead><tbody>';

function loadSyncState(){

function saveSyncState(){lsSet("ygl_sync",JSON.stringify({url:sync.url,user:sync.user,token:sync.token,since:sync.since,last:sync.last,dirty:sync.dirty,cfgv:sync.cfgv||0}));}
function syncUrl(){return sync.url||SYNC_URL;}

function syncPost(payload){
  var url=syncUrl();
  if(!url)return Promise.reject(new Error("No sync server address set"));
  var ctl=typeof AbortController!=="undefined"?new AbortController():null;
  var t=ctl?setTimeout(function(){ctl.abort();},25000):0;
  return fetch(url,{method:"POST",body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined}).then(function(r){
    clearTimeout(t);
    if(!r.ok)throw new Error("Server error "+r.status);
    return r.json();
  }).catch(function(e){clearTimeout(t);throw (e&&e.name==="AbortError")?new Error("Timed out"):e;});
}
function pendingList(){
  var out=[];
  Object.keys(sync.dirty).forEach(function(k){
    var kind=k.charAt(0),id=k.slice(2);
    var rec=kind==="s"?sessions[id]:(kind==="l"?ledger[id]:(kind==="u"?customers[id]:(k==="c:main"?config:null)));
    if(rec)out.push({key:k,u:rec._u||1,rec:rec});
  });
  return out;
}
function applyRemote(recs){
  var chS=false,chL=false,chC=false,chU=false;
  recs.forEach(function(r){
    if(!r||!r.key||!r.rec)return;
    var kind=r.key.charAt(0),id=r.key.slice(2),rec=r.rec;
    if(kind==="s"){var a=sessions[id];if(!a||(rec._u||0)>(a._u||0)){sessions[id]=rec;chS=true;}}
    else if(kind==="l"){var b=ledger[id];if(!b||(rec._u||0)>(b._u||0)){ledger[id]=rec;chL=true;}}
    else if(kind==="c"){if((rec._u||0)>(config._u||0)){config=Object.assign(clone(DEFAULT_CONFIG),rec);chC=true;}}
    else if(kind==="u"){var cu2=customers[id];if(!cu2||(rec._u||0)>(cu2._u||0)){customers[id]=rec;chU=true;}}
  });
  if(chS)lsSet("ygl_sessions",JSON.stringify(sessions));
  if(chL)lsSet("ygl_ledger",JSON.stringify(ledger));
  if(chC)lsSet("ygl_config",JSON.stringify(config));
  if(chU)lsSet("ygl_customers",JSON.stringify(customers));
  return chS||chL||chC||chU;
}
function syncNow(manual){
  if(!syncActive()||!sync.token||!syncUrl())return Promise.resolve();
  if(sync.busy){sync.queued=true;return Promise.resolve();}
  sync.busy=true;setSyncStatus("syncing");
  var sent=pendingList();
  return syncPost({action:"sync",user:sync.user,token:sync.token,since:sync.since,changes:sent}).then(function(res){
    if(!res.ok){
      if(res.auth){sync.token="";saveSyncState();setSyncStatus("off");toast("Please sign in again to keep syncing.");return;}
      throw new Error(res.error||"Sync failed");
    }
    var changed=applyRemote(res.records||[]);
    sent.forEach(function(it){
      var cur=it.key==="c:main"?config:(it.key.charAt(0)==="s"?sessions[it.key.slice(2)]:(it.key.charAt(0)==="u"?customers[it.key.slice(2)]:ledger[it.key.slice(2)]));
      if(!cur||(cur._u||1)===it.u)delete sync.dirty[it.key];
    });
    sync.since=res.now;sync.last=Date.now();sync.err="";saveSyncState();
    setSyncStatus(Object.keys(sync.dirty).length?"pending":"ok");
    if(changed)refresh();
  }).catch(function(e){
    sync.err=(e&&e.message)||"offline";setSyncStatus("error");
    if(manual)toast("Sync failed: "+sync.err);
  }).then(function(){
    sync.busy=false;
    if(sync.queued){sync.queued=false;syncSoon();}
  });
}
function markAllDirty(){
  Object.keys(sessions).forEach(function(id){sync.dirty["s:"+id]=1;});

}
function syncAuth(action,user,pass,code){

    sync.user=res.user;sync.token=res.token;sync.since=0;sync.err="";

    return syncNow(true);
  });
}

function tick(){
  var now=Date.now();
  var c=new Date(now);
  var h=c.getHours()%12||12;
  document.getElementById("clk").textContent=h+":"+pad(c.getMinutes())+":"+pad(c.getSeconds())+" "+(c.getHours()>=12?"PM":"AM");
  document.getElementById("clkd").textContent=fmtDate(now);
  var cards=view.querySelectorAll(".card[data-sid]");
  for(var i=0;i<cards.length;i++){
    var el=cards[i],s=sessions[el.getAttribute("data-sid")];if(!s)continue;
    var ref=s.pausedAt||now,rem=s.endsAt-ref,over=rem<0,abs=Math.abs(rem);
    var mm=Math.floor(abs/60000),ss=Math.floor(abs%60000/1000);
    var t=el.querySelector("[data-timer]");
    t.textContent=(over?"+":"")+(mm>=60?Math.floor(mm/60)+":"+pad(mm%60):pad(mm))+":"+pad(ss);
    var pm=s.pausedMs||0,total=Math.max(1,s.endsAt-s.checkIn-pm);
    el.querySelector("[data-bar]").style.width=Math.min(100,Math.max(0,(ref-s.checkIn-pm)/total*100))+"%";
    var wasOver=el.classList.contains("over");
    var wasPaused=el.classList.contains("paused"),isPaused=!!s.pausedAt;if(over!==wasOver||isPaused!==wasPaused){el.classList.toggle("over",over);el.classList.toggle("paused",isPaused);var chip=el.querySelector("[data-chip]");chip.textContent=isPaused?"Paused":(over?"Overtime":"In use");chip.className="chip "+(isPaused?"booked":(over?"over":"active"));}
  }
}

  var now=Date.now(),es=effStatus(s,now);
  var label={active:"Inside",done:"Left",booked:"Booked",cancelled:"Cancelled",noshow:"No-show"}[es];
  var h='<h2>'+esc(s.name)+'</h2><div class="kv"><span>Status</span><b>'+label+'</b><span>Station</span><b>'+esc(stationName(s.stationId))+'</b>'+
    '<span>Slot</span><b>'+fmtDate(s.startAt)+', '+fmtTime(s.startAt)+' to '+fmtTime(s.endsAt)+'</b>'+
    (s.phone?'<span>Phone</span><b>'+esc(s.phone)+'</b>':'')+'<span>Players</span><b>'+s.players+'</b>'+(s.source==="online"?'<span>Booked</span><b>Online by customer</b>':'')+
    (s.checkIn?'<span>Entry</span><b>'+fmtTime(s.checkIn)+'</b>':'')+(s.checkOut?'<span>Exit</span><b>'+fmtTime(s.checkOut)+'</b>':'')+
    (s.status==="done"?'<span>Paid</span><b>'+money(s.amount)+(s.pay?' ('+esc(s.pay)+')':'')+'</b>':'')+'</div><div class="actions">';
  h+='<button class="btn" data-act="mclose">Close</button>';
  if(es==="booked")h+='<button class="btn danger" data-act="cancel" data-id="'+id+'">Cancel booking</button><button class="btn primary" data-act="in" data-id="'+id+'">Check in now</button>';
  if(es==="noshow")h+='<button class="btn danger" data-act="cancel" data-id="'+id+'">Clear no-show</button>';
  if(es==="active")h+='<button class="btn primary" data-act="out" data-id="'+id+'">Check out</button>';
  if(es==="done")h+='<button class="btn primary" data-act="editpay" data-id="'+id+'">Edit payment</button>';
  h+='</div>';
  openModal(h);
}

/* ---------- CSV ---------- */
function exportCsv(){
  var now=Date.now();
  var rows=list().filter(function(s){var t=s.checkIn||s.startAt;return t>=logDate&&t<logDate+864e5&&s.status!=="cancelled";})
    .sort(function(a,b){return (a.checkIn||a.startAt)-(b.checkIn||b.startAt);});
  function q(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
  var lines=[["Guest","Phone","Players","Station","Slot start","Slot end","Entry","Exit","Minutes","Amount","Paid by","Status"].join(",")];
  rows.forEach(function(s){
    lines.push([s.name,s.phone,s.players,stationName(s.stationId),fmtTime(s.startAt),fmtTime(s.endsAt),s.checkIn?fmtTime(s.checkIn):"",s.checkOut?fmtTime(s.checkOut):"",
      s.checkIn?Math.round(playedMin(s,s.checkOut||now)):"",s.amount==null?"":s.amount,s.pay||"",effStatus(s,now)].map(q).join(","));
  });
  downloads.save({filename:"ygl-log-"+inputDate(logDate)+".csv",data:lines.join("\n")}).catch(function(e){if(!e||e.code!=="declined")toast("Couldn\u2019t export the file.");});
}

/* ---------- events ---------- */
document.querySelector(".tabs").addEventListener("click",function(e){
  var b=e.target.closest(".tab");if(!b)return;tab=b.getAttribute("data-tab");render();
});
function onAct(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.getAttribute("data-act"),id=el.getAttribute("data-id"),stid=el.getAttribute("data-st");
  switch(a){
    case "mclose":closeModal();break;
    case "walk":walkModal(stid);break;
    case "book":bookModal(stid,null,dayStart(Date.now()));break;
    case "bookcell":bookModal(stid,parseInt(el.getAttribute("data-t"),10),slotDate);break;
    case "in":if(sessions[id]){closeModal();checkIn(sessions[id]);}break;
    case "cancel":if(sessions[id]){closeModal();cancelBooking(sessions[id]);render();}break;
    case "out":closeModal();outModal(id);break;
    case "pause":if(sessions[id])pauseSession(sessions[id]);break;
    case "resume":if(sessions[id])resumeSession(sessions[id]);break;
    case "ext":if(sessions[id])extendModal(id);break;
    case "extgo":closeModal();if(sessions[id])extend(sessions[id],parseInt(el.getAttribute("data-m"),10));break;
    case "addp":if(sessions[id])changePlayers(sessions[id],1);break;
    case "subp":if(sessions[id])changePlayers(sessions[id],-1);break;
    case "detail":detailModal(id);break;
    case "editpay":closeModal();editPayModal(id);break;
    case "dprev":slotDate-=864e5;render();break;
    case "dnext":slotDate+=864e5;render();break;
    case "dtoday":slotDate=dayStart(Date.now());render();break;
    case "lprev":logDate-=864e5;render();break;
    case "lnext":logDate+=864e5;render();break;
    case "ltoday":logDate=dayStart(Date.now());render();break;
    case "rp":setRevPreset(el.getAttribute("data-p"));render();break;
    case "addrev":revModal(null);break;
    case "editrev":revModal(id);break;
    case "delrev":delRevModal(id);break;
    case "csv":exportCsv();break;
    case "copylink":copyBookLink();break;
    case "custblock":toggleBlock(id);break;
    case "accent":setAccent(el.getAttribute("data-c"));break;
    case "syncmode":syncModal(el.getAttribute("data-p"));break;
    case "syncnow":syncNow(true).then(function(){syncModal("in");});break;
    case "synclogout":syncLogout(false);break;
    case "syncclear":syncClearModal();break;
    case "ylgst":useYglStations();break;
    case "addst":readStations();config.stations.push({id:"st"+Date.now().toString(36),name:"New station",rate:100});render();break;
    case "rmst":removeStation(parseInt(el.getAttribute("data-i"),10));break;
    case "savecfg":saveSetup();break;
  }
}
view.addEventListener("click",onAct);
modalEl.addEventListener("click",onAct);

function readStations(){
  var ins=view.querySelectorAll("#stlist input");
  for(var i=0;i<ins.length;i++){
    var idx=+ins[i].getAttribute("data-i"),f=ins[i].getAttribute("data-f");
    if(!config.stations[idx])continue;
    if(f==="name")config.stations[idx].name=ins[i].value.trim()||config.stations[idx].name;
    else config.stations[idx].rate=Math.max(0,parseFloat(ins[i].value)||0);
  }
}
function useYglStations(){
  var busy=list().filter(function(s){return s.status==="active"||(s.status==="booked"&&s.endsAt>Date.now());});
  if(busy.length){toast("Finish or cancel active and upcoming bookings first.");return;}
  config.stations=clone(DEFAULT_CONFIG).stations;
  setupMsg={t:"Saving\u2026",c:""};
  saveConfig().then(function(){setupMsg={t:"Stations updated at "+fmtTime(Date.now())+". Now set your rates and tap Save setup.",c:"var(--free)"};if(tab==="setup")render();}).catch(function(e){setupMsg={t:"Not saved: "+((e&&(e.message||e.code))||"unknown error"),c:"var(--over)"};if(tab==="setup")render();});
  render();
}
function removeStation(i){
  readStations();
  var st=config.stations[i];if(!st)return;
  var busy=list().some(function(s){return s.stationId===st.id&&(s.status==="active"||(s.status==="booked"&&s.endsAt>Date.now()));});
  if(busy){toast(st.name+" has an active or upcoming booking. Finish or cancel it first.");return;}
  config.stations.splice(i,1);render();
}
function saveSetup(){try{saveSetupInner();}catch(e){setupMsg={t:"Not saved: "+(e&&e.message?e.message:"unexpected error"),c:"var(--over)"};render();}}
function saveSetupInner(){
  readStations();
  var open=parseInt(document.getElementById("c-open").value,10),close=parseInt(document.getElementById("c-close").value,10);
  if(close<=open){toast("Closing time must be after opening time.");return;}
  config.open=open;config.close=close;
  config.slotMin=parseInt(document.getElementById("c-slot").value,10);
  config.minBillMin=Math.max(0,parseInt(document.getElementById("c-min").value,10)||0);
  config.roundMin=Math.max(1,parseInt(document.getElementById("c-round").value,10)||15);
  config.perPlayer=document.getElementById("c-pp").value==="1";
  config.currency=document.getElementById("c-cur").value.trim()||"\u20B9";
  config.lounge=document.getElementById("c-lounge").value.trim().slice(0,40);
  var obOn=document.getElementById("ob-on");
  if(obOn){config.ob={on:obOn.value==="1",days:Math.max(1,Math.min(30,parseInt(document.getElementById("ob-days").value,10)||7)),notice:Math.max(0,Math.min(240,parseInt(document.getElementById("ob-notice").value,10)||0)),max:Math.max(10,Math.min(480,parseInt(document.getElementById("ob-max").value,10)||180))};}
  setupMsg={t:"Saving\u2026",c:""};
  saveConfig().then(function(){setupMsg={t:"Saved at "+fmtTime(Date.now())+".",c:"var(--free)"};toast("Setup saved.");if(tab==="setup")render();}).catch(function(e){setupMsg={t:"Not saved: "+((e&&(e.message||e.code))||"unknown error")+". Make sure you are signed in with edit access.",c:"var(--over)"};if(tab==="setup")render();});
  render();
}

render();
tick();
initStore();
})();
</script>
